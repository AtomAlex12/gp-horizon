# usque-keenetic-web — served on :91 (nfqws-keenetic-web uses :90)
# Loaded via /opt/etc/lighttpd/lighttpd.conf -> include conf.d/*.conf

server.modules += ( "mod_cgi", "mod_setenv" )

# CGI (S51usque) must run as root: ndmc / start-stop-daemon / interface setup.
server.username  := ""
server.groupname := ""

$SERVER["socket"] == ":91" {
    server.document-root = "/opt/share/www/usque"
    server.errorlog      = "/opt/var/log/lighttpd-usque.log"
    index-file.names     = ( "index.html" )

    cgi.assign = ( ".php" => "/opt/bin/php-cgi" )
    static-file.exclude-extensions = ( ".php" )

    setenv.set-environment = (
        "PATH" => "/opt/sbin:/opt/bin:/opt/usr/sbin:/opt/usr/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    )

    # SPA fallback
    server.error-handler-404 = "/index.html"
}
