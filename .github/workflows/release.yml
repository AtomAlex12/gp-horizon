# Tag vX.Y.Z[-pre.N] on main → a GitHub release with everything the
# installers download (`make release`), and the controller image on
# ghcr.io built from those same files. The tag must equal v$(cat VERSION);
# a "-" in it marks a pre-release (and keeps the image's :latest where it was).
#
# SHA256SUMS lists every file and the image's digest, and is signed with the
# release key (secret NUXK_SIGNING_KEY, an OpenSSH ed25519 key): routers
# check the signature with the key nuxk-core carries, a Pi with the one in
# nuxk-full.sh. No secret — no release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: tag matches VERSION
        run: |
          v=$(tr -d ' \n\r' < VERSION)
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "tag $GITHUB_REF_NAME != v$v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - run: sudo apt-get install -y --no-install-recommends busybox
      - run: make check
      - name: the lite installer under busybox ash (the router's shell)
        run: SH="busybox sh" sh install/lite_test.sh
      - run: make release

      # --- the controller image, from the release's own files --------------
      - name: image context
        run: |
          d=dist/image
          rm -rf "$d" && mkdir -p "$d/web"
          cp "dist/nuxk-horizon-$VERSION"/nuxk-controller-linux-* "$d/"
          tar -C "$d/web" -xzf "dist/nuxk-horizon-$VERSION/nuxk-web-full-$VERSION.tar.gz"
          cp -r nuxk-controller/plugins "$d/plugins"
          img="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')/nuxk-horizon-controller"
          tags="$img:$VERSION"
          case "$VERSION" in *-*) ;; *) tags="$tags,$img:latest" ;; esac
          echo "IMAGE_TAGS=$tags" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: dist/image
          file: deploy/release/Dockerfile.controller
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ env.IMAGE_TAGS }}

      - name: the image's digest into the release; SHA256SUMS signed
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          NUXK_SIGNING_KEY: ${{ secrets.NUXK_SIGNING_KEY }}
        run: |
          [ -n "$NUXK_SIGNING_KEY" ] || { echo "::error::no NUXK_SIGNING_KEY secret — releases are signed"; exit 1; }
          case "$DIGEST" in sha256:*) ;; *) echo "::error::no image digest: '$DIGEST'"; exit 1 ;; esac
          out="dist/nuxk-horizon-$VERSION"
          echo "$DIGEST" > "$out/controller-image"
          make sums
          key="$RUNNER_TEMP/release-key"
          (umask 077 && printf '%s\n' "$NUXK_SIGNING_KEY" > "$key")
          ssh-keygen -Y sign -f "$key" -n nuxk-release "$out/SHA256SUMS"
          rm -f "$key"
          # checked with the key nuxk-core and nuxk-full.sh carry: what routers and Pis will check
          ssh-keygen -Y verify -f nuxk-core/internal/release/allowed_signers -I release@nuxk-horizon \
            -n nuxk-release -s "$out/SHA256SUMS.sig" < "$out/SHA256SUMS"
          tar -C dist -czf "dist/nuxk-horizon-$VERSION.tar.gz" "nuxk-horizon-$VERSION"
      - name: release notes from CHANGELOG
        # plain prefix match: "\\[" in a dynamic regex is a bracket in gawk
        run: awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {p=1; next} index($0, "## [") == 1 {p=0} p' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/nuxk-horizon-${{ env.VERSION }}/*
            dist/nuxk-horizon-${{ env.VERSION }}.tar.gz
