name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/version.sh check

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuxk-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: make fmt-check
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./internal/core/ ./internal/engine/
      - name: cross-compile
        run: make cross   # version from /VERSION, commit from git
      - uses: actions/upload-artifact@v4
        with:
          name: nuxk-core
          path: nuxk-core/dist/*

  installer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuxk-installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...   # incl. end-to-end over a real SSH server
      - run: sh ../engines/nuxk-nfqws2/shim_test.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuxk-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run check:api    # schema.d.ts is generated from nuxk-core/api/openapi.yaml
      - run: npm run check
      - run: npm run build        # full  -> dist/
      - run: npm run build:lite   # lite  -> dist-lite/
      - uses: actions/upload-artifact@v4
        with:
          name: nuxk-web
          path: |
            nuxk-web/dist/**
            nuxk-web/dist-lite/**

  # release bundles on tag: see .github/workflows/release.yml (`make release`);
  # opkg packages are wired after nuxk-plane.
