# nuxk-core configuration. Shell-sourceable KEY="value".

# API listen address. Keep it loopback unless you need remote access.
LISTEN="127.0.0.1:4141"

# Bearer token for programs (nuxk-controller on the Pi gets it by pairing
# with the root password). Empty = loopback-only for programs.
API_TOKEN=""

# Browser login to the web UI: this account of the box, checked against
# Entware's shadow file — the same login and password as SSH.
# AUTH_USER="off" turns the login off.
#AUTH_USER="root"
#AUTH_FILES="/opt/etc/shadow /opt/etc/passwd"

# Flat-file state root.
STATE_DIR="/opt/etc/nuxk"

# Serve the lite web build from here (set by the nuxk-web package).
WEB_ROOT="/opt/share/www/nuxk"

# Engine init scripts.
ENGINE_USQUE="/opt/etc/init.d/S51usque"
ENGINE_NFQWS2="/opt/etc/init.d/S51nfqws2"
ENGINE_XRAY="/opt/etc/init.d/S52xray-nuxk"
