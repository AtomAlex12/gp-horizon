# nuxk-core configuration. Shell-sourceable KEY="value".

# API listen address. Keep it loopback unless you need remote access.
LISTEN="127.0.0.1:4141"

# Bearer token for non-loopback clients (nuxk-web in Docker, another site).
# Empty = loopback-only, no auth.
API_TOKEN=""

# Flat-file state root.
STATE_DIR="/opt/etc/nuxk"

# Serve the lite web build from here (set by the nuxk-web package).
WEB_ROOT="/opt/share/www/nuxk"

# Engine init scripts.
ENGINE_USQUE="/opt/etc/init.d/S51usque"
ENGINE_NFQWS2="/opt/etc/init.d/S51nfqws2"
ENGINE_XRAY="/opt/etc/init.d/S52xray"
