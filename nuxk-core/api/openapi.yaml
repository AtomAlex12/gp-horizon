openapi: 3.1.0

info:
  title: nuxk-core agent API
  version: "1"
  description: >
    The contract between the nuxk-core agent (on the router, or the Pi test
    stand) and its clients: the lite web UI served by the agent itself and
    nuxk-controller on the Pi.

    Single-tenant. Every path except /healthz needs `Authorization: Bearer
    <API_TOKEN>` (`/opt/etc/nuxk/nuxk.conf`); a loopback caller is let in
    without a token only when no token is configured. Responses are the
    resource itself; errors are `{"error":{"code","message"}}` plus the HTTP
    status. Request bodies are capped at 4 MiB.

    This file is checked against the agent's route table in CI
    (TestOpenAPIMatchesRoutes): an endpoint exists here if and only if the
    agent serves it. Planned endpoints are not listed until they exist.
  license: { name: MIT }

servers:
  - url: http://{host}:4141
    variables: { host: { default: 192.168.1.1 } }

security:
  - bearer: []

tags:
  - { name: agent, description: the box itself — liveness, identity, counters, log, live events }
  - { name: engines, description: nfqws2 / usque / xray }
  - { name: plane, description: "routing plane: the DPI / WARP / VLESS lists" }
  - { name: suggest, description: "route suggestions: probe a domain, say why it doesn't open and which way out works" }

paths:
  /api/v1/nfqws2/files:
    get:
      tags: [agent]
      operationId: nfqwsFiles
      parameters:
        - {name: section, in: query, required: true, schema: {type: string, enum: [config, lists, scripts, interfaces]}}
        - {name: name, in: query, schema: {type: string}}
      responses:
        "200":
          description: File catalogue or content
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      type: object
                      required: [name, group, read_only]
                      properties:
                        name: {type: string}
                        group: {type: string}
                        read_only: {type: boolean}
                  - type: array
                    items:
                      type: object
                      required: [name, label, type]
                      properties:
                        name: {type: string}
                        label: {type: string}
                        type: {type: string}
                  - type: object
                    required: [text]
                    properties:
                      text: {type: string}

  /api/v1/healthz:
    get:
      tags: [agent]
      operationId: healthz
      summary: Liveness (no token)
      security: []
      responses:
        "200":
          description: alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: { status: { type: string, const: ok } }

  /api/v1/version:
    get:
      tags: [agent]
      operationId: version
      responses:
        "200":
          description: build
          content: { application/json: { schema: { $ref: "#/components/schemas/Version" } } }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/info:
    get:
      tags: [agent]
      operationId: info
      summary: What box this is (router or test stand), firmware, uptime
      responses:
        "200":
          description: node
          content: { application/json: { schema: { $ref: "#/components/schemas/NodeInfo" } } }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/status:
    get:
      tags: [agent]
      operationId: status
      summary: Whole platform state — every engine plus the routing plane
      description: Served from memory (the reconcile loop keeps it fresh); never blocks on an engine.
      responses:
        "200":
          description: snapshot
          content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/metrics:
    get:
      tags: [agent]
      operationId: metrics
      summary: Raw counters from /proc — rates are the reader's job
      responses:
        "200":
          description: counters
          content: { application/json: { schema: { $ref: "#/components/schemas/Metrics" } } }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/logs:
    get:
      tags: [agent]
      operationId: logs
      summary: The agent's recent log (last 500 entries kept in memory)
      parameters:
        - { name: after, in: query, description: only entries with a larger seq, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, description: "at most this many, newest (default 200, max 500)", schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: entries, oldest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/LogEntry" } }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/events:
    get:
      tags: [agent]
      operationId: events
      summary: Live stream (Server-Sent Events)
      description: >
        `event: status` with a Status snapshot on connect and on every change;
        `event: log` with a LogEntry per new log line; a `: ping` comment every
        20 s. The stream stays open until the client goes away.
      responses:
        "200":
          description: text/event-stream
          content: { text/event-stream: { schema: { type: string } } }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/engines:
    get:
      tags: [engines]
      operationId: engines
      responses:
        "200":
          description: every wired engine
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EngineState" } }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/engines/{kind}:
    get:
      tags: [engines]
      operationId: engine
      summary: One engine, read live (not from the snapshot)
      parameters: [{ $ref: "#/components/parameters/kind" }]
      responses:
        "200":
          description: live info
          content: { application/json: { schema: { $ref: "#/components/schemas/EngineInfo" } } }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /api/v1/engines/{kind}/{action}:
    post:
      tags: [engines]
      operationId: engineAction
      summary: start | stop | restart | probe | apply
      description: >
        start/stop/restart also record the run intent (the controller keeps it
        with backoff). probe runs an active check and returns it. apply takes a
        Routing body.
      parameters:
        - { $ref: "#/components/parameters/kind" }
        - { name: action, in: path, required: true, schema: { type: string, enum: [start, stop, restart, probe, apply] } }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/Routing" } } }
      responses:
        "200":
          description: probe result
          content: { application/json: { schema: { $ref: "#/components/schemas/Probe" } } }
        "202":
          description: done
          content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /api/v1/engines/{kind}/config:
    put:
      tags: [engines]
      operationId: engineConfig
      summary: Runtime config (xray only today); stored 0600, never served back
      parameters: [{ $ref: "#/components/parameters/kind" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EngineConfig" } } }
      responses:
        "200":
          description: applied
          content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /api/v1/plane:
    get:
      tags: [plane]
      operationId: plane
      responses:
        "200":
          description: plane status
          content: { application/json: { schema: { $ref: "#/components/schemas/PlaneStatus" } } }
        "404": { description: "plane is off (PLANE= in nuxk.conf)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/plane/lists:
    get:
      tags: [plane]
      operationId: planeLists
      responses:
        "200":
          description: desired lists
          content: { application/json: { schema: { $ref: "#/components/schemas/PlaneDesired" } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [plane]
      operationId: setPlaneLists
      summary: Replace every list and the tunnel-down policy; the plane reconciles right away
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlaneDesired" } } }
      responses:
        "200":
          description: stored
          content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/plane/import:
    post:
      tags: [plane]
      operationId: planeImport
      summary: Copy the user's own routed Keenetic lists into a nuxk list
      description: The user's groups stay untouched; their domains are held back as conflicts until removed there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groups, mode]
              properties:
                groups: { type: array, items: { type: string }, minItems: 1 }
                mode: { $ref: "#/components/schemas/ListMode" }
      responses:
        "200":
          description: the new desired lists
          content: { application/json: { schema: { $ref: "#/components/schemas/PlaneDesired" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/suggest:
    get:
      tags: [suggest]
      operationId: suggest
      summary: Suggestions so far, which ways out can be probed, and how many domains are still being checked
      responses:
        "200":
          description: overview
          content: { application/json: { schema: { $ref: "#/components/schemas/SuggestOverview" } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/suggest/check:
    post:
      tags: [suggest]
      operationId: suggestCheck
      summary: Probe these domains in the background (redoes ones already checked)
      description: |
        Each domain is tried directly; only if that doesn't open it are the tunnels tried.
        Domains already in a nuxk list or in the user's own Keenetic routing are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domains]
              properties:
                domains: { type: array, items: { type: string }, minItems: 1, maxItems: 20 }
      responses:
        "202":
          description: queued; poll GET /suggest
          content: { application/json: { schema: { $ref: "#/components/schemas/SuggestQueued" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/suggest/scan:
    post:
      tags: [suggest]
      operationId: suggestScan
      summary: Probe the built-in list of popular services that refuse Russian addresses
      description: Leaves alone domains checked within the hour, accepted or dismissed.
      responses:
        "202":
          description: queued; poll GET /suggest
          content: { application/json: { schema: { $ref: "#/components/schemas/SuggestQueued" } } }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/suggest/{domain}/accept:
    post:
      tags: [suggest]
      operationId: suggestAccept
      summary: Put the domain into the plane's «Подбор» list
      description: |
        Nothing changes on the router unless the plane is in apply mode (PLANE_APPLY=1).
        `mode` may be the suggested one (default) or the verified alternative.
      parameters:
        - { name: domain, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { $ref: "#/components/schemas/ListMode" }
      responses:
        "200":
          description: added to the list
          content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "routing wouldn't help for this domain", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/suggest/{domain}:
    delete:
      tags: [suggest]
      operationId: suggestDismiss
      summary: Dismiss a suggestion; a scan won't bring it back
      parameters:
        - { name: domain, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: dismissed
          content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }

  parameters:
    kind:
      name: kind
      in: path
      required: true
      schema: { $ref: "#/components/schemas/EngineKind" }

  responses:
    Error:
      description: error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Ok:
      type: object
      required: [status]
      properties: { status: { type: string } }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    Version:
      type: object
      required: [version, commit, api]
      properties:
        version: { type: string }
        commit: { type: string }
        api: { type: string, const: v1 }

    NodeInfo:
      type: object
      required: [role, hostname, arch, kernel, uptime_sec, core_since, version, commit]
      properties:
        role:
          type: string
          enum: [router, stand, host]
          description: "router = Keenetic; stand = Docker prototype on the Pi"
        hostname: { type: string }
        model: { type: string, description: Keenetic model (router only) }
        firmware: { type: string, description: KeeneticOS release (router only) }
        arch: { type: string }
        kernel: { type: string }
        uptime_sec: { type: integer, description: the box }
        core_since: { type: integer, description: unix seconds nuxk-core started }
        version: { type: string }
        commit: { type: string }

    Metrics:
      type: object
      required: [ts, ifaces, nfqueues, conntrack, conntrack_max, load1, mem_total_kb, mem_avail_kb, core_rss_kb]
      properties:
        ts: { type: integer, description: unix milliseconds }
        wan: { type: string, description: interface of the IPv4 default route }
        ifaces:
          type: object
          additionalProperties: { $ref: "#/components/schemas/IfaceCounters" }
        nfqueues: { type: array, items: { $ref: "#/components/schemas/NFQueue" } }
        conntrack: { type: integer }
        conntrack_max: { type: integer }
        load1: { type: number }
        mem_total_kb: { type: integer }
        mem_avail_kb: { type: integer }
        core_rss_kb: { type: integer }

    IfaceCounters:
      type: object
      required: [rx, tx]
      properties:
        rx: { type: integer, description: bytes received }
        tx: { type: integer, description: bytes sent }

    NFQueue:
      type: object
      required: [num, packets, dropped, waiting]
      properties:
        num: { type: integer }
        packets: { type: integer, description: packets through the queue since boot }
        dropped: { type: integer }
        waiting: { type: integer }

    LogEntry:
      type: object
      required: [seq, ts, level, msg]
      properties:
        seq: { type: integer }
        ts: { type: integer, description: unix milliseconds }
        level: { type: string, enum: [debug, info, warn, error] }
        msg: { type: string }
        attrs: { type: string }

    Status:
      type: object
      required: [version, ts, engines, plane]
      properties:
        version: { type: string }
        ts: { type: integer }
        engines: { type: array, items: { $ref: "#/components/schemas/EngineState" } }
        plane:
          description: PlaneStatus, or {"backend":"off"} when the plane is off
          oneOf:
            - $ref: "#/components/schemas/PlaneStatus"
            - $ref: "#/components/schemas/PlaneOff"

    PlaneOff:
      type: object
      required: [backend]
      properties: { backend: { type: string, const: "off" } }

    EngineKind: { type: string, enum: [nfqws2, usque, xray] }
    Health: { type: string, enum: [ok, degraded, down, unknown] }

    EngineInfo:
      type: object
      required: [kind, running, uptime_sec, health, routes]
      properties:
        kind: { $ref: "#/components/schemas/EngineKind" }
        running: { type: boolean }
        pid: { type: integer }
        uptime_sec: { type: integer }
        version: { type: string }
        health: { $ref: "#/components/schemas/Health" }
        iface: { type: string, description: "tunnel (opkgtun0) or, for nfqws2, the WAN it hooks" }
        endpoint: { type: string, description: upstream the tunnel dials }
        routes: { type: integer }
        detail: { type: object, additionalProperties: { type: string } }

    EngineState:
      description: EngineInfo plus the last probe and the controller's view
      allOf:
        - $ref: "#/components/schemas/EngineInfo"
        - type: object
          properties:
            probe: { $ref: "#/components/schemas/Probe" }
            probe_at: { type: integer }
            want_run: { type: boolean, description: "run intent: true keep running, false keep stopped, absent unmanaged" }
            last_error: { type: string }

    Probe:
      type: object
      required: [ok, ts]
      properties:
        ok: { type: boolean }
        egress_ip: { type: string }
        rtt_ms: { type: number }
        detail: { type: object, additionalProperties: { type: string } }
        reason: { type: string }
        ts: { type: integer }

    Routing:
      type: object
      properties:
        domains: { type: array, items: { type: string } }
        cidrs: { type: array, items: { type: string } }
        endpoints: { type: array, items: { type: string } }
        strategy: { type: string }

    EngineConfig:
      type: object
      description: engine-specific (xray — vless_uri or sub_url)
      additionalProperties: { type: string }

    ListMode:
      type: string
      enum: [desync, warp, vless]
      description: "desync = «DPI» (nfqws2, direct); warp = usque tunnel; vless = xray tunnel"

    OnDown:
      type: string
      enum: [direct, block]
      description: what WARP/VLESS lists do while their tunnel is down

    PlaneList:
      type: object
      required: [name, mode, domains]
      properties:
        name: { type: string }
        mode: { $ref: "#/components/schemas/ListMode" }
        domains: { type: array, items: { type: string }, minItems: 1 }
        source: { type: string, description: "manual | imported:<group> | preset:<id>" }

    PlaneDesired:
      type: object
      required: [lists]
      properties:
        lists: { type: array, items: { $ref: "#/components/schemas/PlaneList" } }
        on_down: { $ref: "#/components/schemas/OnDown" }
        manage_desync: { type: boolean, description: nuxk owns nfqws2's hostlist (set by the first DPI list) }

    PlaneGroup:
      type: object
      required: [name, mode, interface, block, domains]
      properties:
        name: { type: string }
        mode: { $ref: "#/components/schemas/ListMode" }
        interface: { type: string }
        block: { type: boolean }
        domains: { type: array, items: { type: string } }

    PlaneOp:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [create-group, add-domains, del-domains, add-route, del-route, delete-group, ensure-v6-deny] }
        group: { type: string }
        interface: { type: string }
        block: { type: boolean }
        domains: { type: array, items: { type: string } }
        groups: { type: array, items: { type: string } }

    PlaneConflict:
      type: object
      required: [domain, group, user_group]
      properties:
        domain: { type: string }
        group: { type: string }
        user_group: { type: string }

    PlaneForeign:
      type: object
      required: [group, interface, domains]
      properties:
        group: { type: string }
        description: { type: string }
        interface: { type: string }
        domains: { type: array, items: { type: string } }

    PlaneStatus:
      type: object
      required: [backend, apply, ifaces, on_down, groups, desync, desync_ok, desync_managed, lists, pending]
      properties:
        backend: { type: string }
        apply: { type: boolean, description: "PLANE_APPLY=1; false = plan only" }
        ifaces: { type: object, additionalProperties: { type: string } }
        on_down: { $ref: "#/components/schemas/OnDown" }
        groups: { type: [array, "null"], items: { $ref: "#/components/schemas/PlaneGroup" } }
        desync: { type: [array, "null"], items: { type: string } }
        desync_ok: { type: boolean }
        desync_managed: { type: boolean }
        lists: { type: [array, "null"], items: { $ref: "#/components/schemas/PlaneList" } }
        pending: { type: [array, "null"], items: { $ref: "#/components/schemas/PlaneOp" } }
        conflicts: { type: array, items: { $ref: "#/components/schemas/PlaneConflict" } }
        foreign: { type: array, items: { $ref: "#/components/schemas/PlaneForeign" } }
        warnings: { type: array, items: { type: string } }
        last_error: { type: string }
        checked_at: { type: integer }
        applied_at: { type: integer }

    SuggestPath:
      type: object
      required: [via, result]
      properties:
        via: { type: string, enum: [direct, vless, warp, dns] }
        result: { type: string, description: "what this way out did, in words for the user" }
        ms: { type: integer }

    SuggestPathInfo:
      type: object
      required: [via, usable]
      properties:
        via: { type: string, enum: [direct, vless, warp] }
        iface: { type: string }
        usable: { type: boolean, description: can be probed right now }
        why: { type: string, description: why not, when it can't }

    Suggestion:
      type: object
      required: [domain, state, confirmed]
      properties:
        domain: { type: string }
        state: { type: string, enum: [checking, ready, accepted, dismissed] }
        verdict:
          type: string
          enum: [ok, geoblock, sni-block, ip-block, dns-block, unknown]
          description: "geoblock = the site refuses this country; sni-block / ip-block = the provider cuts it; dns-block = DNS gives a stub"
        mode: { $ref: "#/components/schemas/ListMode", description: "the list to put the domain in; absent = routing wouldn't help or nothing can be said" }
        alt: { $ref: "#/components/schemas/ListMode", description: another way that was tried and works }
        confirmed: { type: boolean, description: "the site really opened through `mode`; false = a conclusion from the evidence, not tried (e.g. DPI)" }
        reason: { type: string, description: why, in words for the user }
        paths: { type: array, items: { $ref: "#/components/schemas/SuggestPath" } }
        checked_at: { type: integer }

    SuggestOverview:
      type: object
      required: [items, paths, busy, desync]
      properties:
        items: { type: [array, "null"], items: { $ref: "#/components/schemas/Suggestion" } }
        paths: { type: [array, "null"], items: { $ref: "#/components/schemas/SuggestPathInfo" } }
        busy: { type: integer, description: domains queued or being probed }
        desync: { type: boolean, description: nfqws2 is wired, so a DPI list is an option }

    SuggestSkip:
      type: object
      required: [domain, reason]
      properties:
        domain: { type: string }
        reason: { type: string }

    SuggestQueued:
      type: object
      required: [queued, skipped]
      properties:
        queued: { type: array, items: { type: string } }
        skipped: { type: array, items: { $ref: "#/components/schemas/SuggestSkip" } }
