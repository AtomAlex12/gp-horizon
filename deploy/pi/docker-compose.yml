# GP Horizon — the development stack for a Raspberry Pi, built from source.
# People install with install/nuxk-full.sh (prebuilt image from the release).
#
#   nuxk        real-engine prototype (usque + nfqws2) from deploy/proto — :4242
#   controller  full web UI + history for the ROUTER's nuxk-core         — :4200
#               (profile "controller"; the first visit runs the setup wizard:
#               admin password, then the router's address + root password)
#
# Start with deploy/pi/bootstrap.sh (checks, kernel modules, WARP registration).
# By hand:
#   docker compose -f deploy/pi/docker-compose.yml up -d --build

# fixed project name: volumes are nuxk-pi_usque-session etc. whatever the checkout dir
name: nuxk-pi

include:
  - ../proto/docker-compose.yml

services:
  controller:
    profiles: ["controller"]
    build:
      context: ../..
      dockerfile: deploy/pi/Dockerfile.controller
      args:
        COMMIT: ${NUXK_COMMIT:-unknown}
    image: nuxk-horizon-controller
    ports: ["4200:4200"]
    environment:
      # optional: an older setup keeps its router without the wizard's step 2
      AGENT_URL: ${AGENT_URL:-}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
    volumes:
      - controller-data:/var/lib/nuxk-controller
    read_only: true
    tmpfs: [/run, /tmp]
    init: true   # reaps what plugins leave behind
    # `supervise` needs these to hand out less: the web/API runs as nobody
    # with none, a plugin gets only the ones in its plugin.json (GP: the
    # NET_* for blockcheck2 inside this container's own network namespace).
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, SETPCAP, KILL, NET_ADMIN, NET_RAW]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  controller-data:
