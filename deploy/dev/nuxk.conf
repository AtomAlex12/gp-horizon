# nuxk-core dev config (baked into the deploy/dev image).
# Listen/web are passed on the CLI; this file wires the mock engine + state dir.
STATE_DIR=/var/lib/nuxk
ENGINE_USQUE=/opt/mock/S51usque-mock
# Requests reach nuxk-core through the Docker bridge (not loopback), so the
# dashboard needs a token. Baked into the web build via VITE_API_TOKEN — dev only.
API_TOKEN=dev-nuxk-token
