# deploy/proto DNS-via-WARP cache/forwarder.
#
# Scope: this container's OWN resolution only (proves the mechanism) — NOT
# published to the Pi's LAN, so it can't clash with the Keenetic router's own
# DHCP/DNS serving the real household. Widening this to the LAN is a
# deliberate later step, not part of this prototype.
no-resolv
no-poll
server=1.1.1.1
server=1.0.0.1
no-hosts
domain-needed
bogus-priv
cache-size=1000
listen-address=127.0.0.1
bind-interfaces
log-queries
log-facility=/opt/var/log/dnsmasq.log
pid-file=/opt/var/run/dnsmasq.pid
user=root
