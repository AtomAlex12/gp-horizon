# usque.conf — deploy/proto prototype config for S51usque-docker.
# Same shape as usque-keenetic's fs/etc/usque/usque.conf; IFACE_IP/IFACE_MASK
# are intentionally unset — without --no-iproute2, usque assigns its own tun
# address itself (see S51usque-docker's header comment).

# Interface for USQUE (e.g. opkgtun0).
IFACE="opkgtun0"

# SNI for traffic masking
SNI="ozon.ru"

# HTTP/2 support
HTTP2_ENABLE=0

# Configuration version
# DO NOT CHANGE THIS VALUE
CONFIG_VERSION=1
