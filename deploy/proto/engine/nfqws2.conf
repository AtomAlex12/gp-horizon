# nfqws2.conf — deploy/proto prototype config.
#
# Deliberately NOT a copy of docs/nfqws2.mgts.conf (the strategy already
# proven on the physical router) — that file references hand-extracted blobs
# (quic_initial_www_google_com.bin, ACTIVE_DISCORD_UDP.bin, ...) that aren't
# in the vendored zapret2 release this image builds from. This config keeps
# the two concrete, MGTS-proven deltas from that file — QUIC repeats=11, and
# a multisplit+seqovl=679 TLS strategy — but points them at the STOCK blob
# names shipped in nfqws2-keenetic/etc/nfqws2/blobs/ (quic_initial.bin,
# tls_clienthello.bin), and narrows scope to exactly the deploy/proto Phase C
# verification target (YouTube/browserleaks SNI-drop) instead of also
# chasing Discord voice ranges. See deploy/proto plan §5/§8.

ISP_INTERFACE="eth0"

NFQWS_BASE_ARGS="--lua-init=@/opt/etc/nfqws2/lua/zapret-lib.lua \
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-antidpi.lua \
                 --lua-init=@/opt/etc/nfqws2/lua/zapret-auto.lua \
                 --blob=quic_initial:@/opt/etc/nfqws2/blobs/quic_initial.bin \
                 --blob=tls_clienthello:@/opt/etc/nfqws2/blobs/tls_clienthello.bin"

NFQWS_ARGS="--filter-tcp=80,443 --filter-l7=http,tls \
            --payload=tls_client_hello \
            --lua-desync=multisplit:pos=2,sniext+1:seqovl=679:seqovl_pattern=tls_clienthello \
            --payload=http_req \
            --lua-desync=multisplit:pos=2,sniext+1:seqovl=679:seqovl_pattern=tls_clienthello"

NFQWS_ARGS_QUIC="--filter-udp=443 --filter-l7=quic \
                 --payload=quic_initial \
                 --lua-desync=fake:blob=quic_initial:repeats=11"

NFQWS_ARGS_UDP=""
NFQWS_ARGS_CUSTOM=""
NFQWS_ARGS_IPSET="" # ipset/CIDR endpoint-hardening deferred — see plan §8

# Working modes, don't change
MODE_LIST="--hostlist=/opt/etc/nfqws2/lists/user.list"
MODE_ALL="--hostlist-exclude=/opt/etc/nfqws2/lists/exclude.list"
MODE_AUTO="$MODE_LIST --hostlist-auto=/opt/etc/nfqws2/lists/auto.list --hostlist-auto-debug=/opt/var/log/nfqws2.log $MODE_ALL"
NFQWS_EXTRA_ARGS="$MODE_AUTO" # MODE_AUTO logs what it detects — useful while debugging this prototype

IPV6_ENABLED=0 # keep the surface small for this prototype pass — see plan §8

TCP_PORTS=80,443
UDP_PORTS=443

# Keenetic policy name — deliberately empty: no ndmc in this image, and
# create_running_config()'s lookup degrades to POLICY_MARK="" gracefully
# when it finds no match, exactly as designed upstream. See S51nfqws2-docker.
POLICY_NAME=""
POLICY_EXCLUDE=0

LOG_LEVEL=1
LOG_DEBUG_PATH="@/opt/var/log/nfqws2-debug.log"
NFQUEUE_NUM=300
USER=nobody
CONFIG_VERSION=1
