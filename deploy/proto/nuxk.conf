# nuxk-core prototype config (deploy/proto). Listen/web are passed on the
# CLI (see Dockerfile CMD); this file wires the real engines + state dir.
STATE_DIR=/var/lib/nuxk
ENGINE_USQUE=/opt/etc/init.d/S51usque-docker
ENGINE_NFQWS2=/opt/etc/init.d/S51nfqws2-docker
# Requests reach nuxk-core through the Docker bridge (not loopback), so the
# dashboard needs a token. Baked into the web build via VITE_API_TOKEN — dev/
# prototype only, not a production secret.
API_TOKEN=proto-nuxk-token
